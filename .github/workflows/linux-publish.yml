name: Publicar paquetes Linux verificados

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Ejecución aprobada de Preparar Linux Mint para beta.5
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verificar origen y descargar paquetes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$RUN_ID" --json conclusion,workflowName,headBranch,event > run.json
          jq -e '.conclusion == "success" and .workflowName == "Preparar Linux Mint" and .headBranch == "main" and .event == "workflow_dispatch"' run.json
          gh run download "$RUN_ID" --name aulablocks-linux-beta5 --dir packages
          cd packages
          sha256sum --check SHA256SUMS-linux.txt
          test "$(dpkg-deb -f AulaBlocks-Arduino-0.10.0-beta.5-Linux-Mint-amd64.deb Version)" = '0.10.0~beta.5'
      - name: Añadir Linux sin reemplazar Windows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload v0.10.0-beta.5 packages/*.deb packages/*.tar.gz packages/SHA256SUMS-linux.txt
          for metadata in packages/*linux*.yml; do
            if [ -f "$metadata" ]; then gh release upload v0.10.0-beta.5 "$metadata"; fi
          done
