name: Preparar version 0.10.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Preparar Arduino sin sensores preinstalados
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/tools/arduino-cli-linux"
          mkdir -p "$runtime/bin" "$runtime/data" "$runtime/user/libraries" "$RUNNER_TEMP/arduino-downloads"
          curl --fail --location --retry 3 https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz -o "$RUNNER_TEMP/arduino-cli.tar.gz"
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  $RUNNER_TEMP/arduino-cli.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/arduino-cli.tar.gz" -C "$runtime/bin"
          export ARDUINO_DIRECTORIES_DATA="$runtime/data"
          export ARDUINO_DIRECTORIES_USER="$runtime/user"
          export ARDUINO_DIRECTORIES_DOWNLOADS="$RUNNER_TEMP/arduino-downloads"
          cli="$runtime/bin/arduino-cli"
          index=https://mcudude.github.io/MiniCore/package_MCUdude_MiniCore_index.json
          "$cli" core update-index --additional-urls "$index"
          "$cli" core install arduino:avr@1.8.8 --additional-urls "$index"
          "$cli" core install MiniCore:avr@3.1.3 --additional-urls "$index"
          printf 'Arduino CLI 1.5.1\nArduino AVR Boards 1.8.8\nMiniCore 3.1.3\nLinux x64. Sensores externos.\n' > "$runtime/RUNTIME-LINUX.txt"
      - name: Compilar los once sensores para Uno y Nano
        run: node tests/compile-all-sensors.mjs tools/arduino-cli-linux
      - name: Crear instalador y archivo portatil
        run: npm run dist:linux -- --publish never
      - name: Verificar paquete y herramientas incluidas
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find release -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/aulablocks-deb"
          runtime="$RUNNER_TEMP/aulablocks-deb/opt/AulaBlocks Arduino/resources/arduino-runtime"
          test -x "$runtime/bin/arduino-cli"
          "$runtime/bin/arduino-cli" version
          node tests/compile-all-sensors.mjs "$runtime"
          cd release
          sha256sum *.deb *.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.tar.gz
            release/*linux*.yml
            release/SHA256SUMS-linux.txt
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run prepare:windows-runtime
      - run: node tests/compile-all-sensors.mjs tools/arduino-cli
      - run: npm run dist:win
      - name: Verificar version interna
        run: node -e "const a=require('@electron/asar');const p=JSON.parse(a.extractFile('release/win-unpacked/resources/app.asar','package.json'));if(p.version!=='0.10.2')throw Error('Version incorrecta');console.log(p.version)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  draft:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Validar archivos y empaquetar sensores sin cambiarlos
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS-linux.txt
          test "$(dpkg-deb -f AulaBlocks-Arduino-0.10.2-Linux-Mint-amd64.deb Version)" = '0.10.2'
          cd ..
          mkdir sensor-delivery
          jq -r '.sensors[].file' sensor-catalog.json | while IFS= read -r file; do cp "$file" sensor-delivery/; done
          cp RELEASE-0.10.2.md sensor-delivery/LEEME.md
          zip -j artifacts/Sensores-AulaBlocks-0.10.2.zip sensor-delivery/*
          cp RELEASE-0.10.2.md INSTRUCCIONES-LINUX-MINT.md artifacts/
          cd artifacts
          sha256sum *.exe *.blockmap *.deb *.tar.gz *.zip *.yml > SHA256SUMS.txt
      - name: Crear borrador de la version completa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create v0.10.2 artifacts/* --draft --target "$RELEASE_SHA" --title "AulaBlocks Arduino 0.10.2 — Windows y Linux Mint" --notes-file RELEASE-0.10.2.md
